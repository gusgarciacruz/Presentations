# &lt;span style="font-size:80%"&gt;Trayectoria en la Universidad EAFIT&lt;/span&gt;
&lt;spam style="font-size:100%"&gt;

&lt;span style="color:blue"&gt;Ingreso a la Universidad EAFIT&lt;/span&gt;: el 6 de junio de 2016 en la categoría profesoral de Profesor Asistente de acuerdo con Estatuto Profesoral 2012. 

Ascensos:
&lt;p style="margin-bottom: -1em"&gt;
  - Profesor Asociado: junio de 2017
  - Profesor Titular: noviembre de 2020 (actualmente 6 años en esta categoría)

En los 10 años que llevó en la Universidad EAFIT mis actividades han estado centradas en tres ejes:
&lt;p style="margin-bottom: -1em"&gt;
  1. Docencia,  (25%)&lt;/span&gt;
  2. Investigación (19%) y consultoría
  3. Administración académica y proyección social (56%)

- Pregrado en Economía: 
  - Econometría 1

- Doctorado/Maestría en Economía:

# &lt;span style="font-size:80%"&gt;Trayectoria en la Universidad EAFIT&lt;/span&gt;
&lt;spam style="font-size:120%"&gt;

**&lt;span style="color:blue"&gt;2. Investigación y consultoría&lt;/span&gt;**
&lt;p style="margin-bottom: -1em"&gt;
- Vinculado a &lt;span style="color:blue"&gt;8 proyectos de financiación interna&lt;/span&gt;, como investigador principal y como co-investigador `\(\Longrightarrow\)` &lt;span style="color:blue"&gt;economía urbana y regional, evaluación de impacto y economía aplicada:

  1. Los millennials en Colombia. Una aproximación a su perfil y caracterización organizaciones. Periodo de ejecución: 2017-1 – 2018-2. En conjunto con la Escuela de Administración
  2. Disparidades regionales en los ingresos laborales en Colombia. Un análisis de sus factores condicionales. Periodo de ejecución: 2017-1 – 2017-2
  3. Accesibilidad, exclusión social y resultados en el mercado laboral. Periodo de ejecución: 2018-1 – 2018-2
  4. Accesibilidad, mercado laboral y calidad de vida. Periodo de ejecución: 2019-1 – 2020-2
  5. El impacto de la regulación laboral sobre las transiciones individuales en el mercado laboral. Periodo de ejecución: 2020-1 – 2021-2
  6. El impacto de la formación para el trabajo sobre la formalidad laboral. Periodo de ejecución: 2022-1 – 2022-2
  7. Housing informality and labor informality in space: in search of the missing links. Periodo de ejecución: 2023-1 – 2024-2
  8. Modelos de interacción espacial usando herramientas computacionales abiertas y datos no convencionales.
Periodo de ejecución: 2025-1 – 2028-2. En conjunto con la Escuela de Ciencias Aplicadas e
Ingeniería

name: plan
# &lt;span style="font-size:80%"&gt;Plan de trabajo durante el sabático&lt;/span&gt;
&lt;spam style="font-size:120%"&gt;

Durante mi año sabático me gustaría profundizar en dos líneas de investigación:
&lt;p style="margin-bottom: -1em"&gt;
- efectos de los amenities sobre la economía urbana
- geografía del cambio climático

A partir de estas investigaciones, se generarán los siguientes productos académicos y de proyección:
&lt;p style="margin-bottom: -1em"&gt;
1. **Producto de nuevo conocimiento**: Se realizará un artículo de investigación, que será sometido a evaluación a revistas clasificadas A en el listado de la Escuela (listado que comienza a regir a partir de enero de 2027) `\(\Longrightarrow\)` &lt;span style="color:blue"&gt;Journal of Urban Economics&lt;/span&gt; (*top tier*) o &lt;span style="color:blue"&gt;Journal of Environmental Economics and Management&lt;/span&gt;

2. **Producto de apropiación social del conocimiento**: Se realizará la presentación de los resultados de las investigaciones en un congreso internacional reconocido en las áreas de economía urbana y regional `\(\Longrightarrow\)` North American Regional Science Council (NARSC) 2027 (noviembre), AREUEA National Conference 2028 (mayo), AREUEA International Conference 2027 (julio) o &lt;span style="color:blue"&gt;North American Meeting of the Urban Economics Association 2027 (septiembre)

3. **Producto de innovación pedagógica**: Se diseñará un curso en temas de transición energética, en particular sobre medición y estimación de efectos del cambio climático, y geografía del cambio climático `\(\Longrightarrow\)` microcredencial en la &lt;span style="color:blue"&gt;Especialización en Organización Industrial y Mercados Energéticos&lt;/span&gt; ofrecido en la Escuela FEG o en la &lt;span style="color:blue"&gt;Maestría en Energía Sostenible&lt;/span&gt; de la Escuela CAeI

name: proy
# &lt;span style="font-size:80%"&gt;Proyección e impacto académico, social y pedagógico del año sabático&lt;/span&gt;
&lt;spam style="font-size:120%"&gt;

**&lt;span style="color:blue"&gt;Impacto académico (producto de nuevo conocimiento)&lt;/span&gt;**

Alta calidad más que cantidad en la producción científica `\(\Longrightarrow\)` &lt;span style="color:blue"&gt;quiero trazarme el objetivo de enviar un documento a una revista de alto impacto en el área de economía y especialmente en economía urbana


Journal of Urban Economics
&lt;p style="margin-bottom: -1em"&gt;
- considerada la revista académica líder (top tier) y de mayor prestigio en el campo de la economía urbana
- Clasificada A en los listados de la Escuela
- SJR(2025)=2.957, ranquea 52 de 759 journals
- Clarivate-JCR (2025): JIF=4, ranquea 85 de 626 journals

Journal of Environmental Economics and Management
&lt;p style="margin-bottom: -1em"&gt;
- A en listado de la Escuela
- SJR(2025)=2.968, 50 de 759 journals
- Clarivate-JCR (2025): JIF=6.4,  ranking 30 de 626

---
# &lt;span style="font-size:80%"&gt;Proyección e impacto académico, social y pedagógico del año sabático&lt;/span&gt;
&lt;spam style="font-size:105%"&gt;

**&lt;span style="color:blue"&gt;Impacto social (producto de apropiación social del conocimiento)&lt;/span&gt;**

- La presentación de avances de la investigación en conferencias internacionales reconocidas en el área de economía urbana y regional, permitirá la interacción con colegas expertos en los temas de interés, lo que implica procesos de retroalimentación para mejorar el documento final y fortalecer la proyección de la Universidad EAFIT a nivel internacional. &lt;span style="color:blue"&gt;Se espera aplicar a la convocatoria de ponencias de la Universidad para financiar la asistencia a una conferencia internacional

- Durante el periodo sabático también se espera tener estancias cortas en alguna universidad en los Estados Unidos en las que puede presentar los resultados de la investigación y establecer algunas agendas de investigación conjunta:

  - Albert Saiz, Department of Urban Studies and Planning, Massachusetts Institute of Technology (MIT).
Co-autor de dos publicaciones en las que se está trabajando y posibilidad de seguir con una agenda de
investigación para el próximo año
  - Gary Painter, BEARE Chair and Professor of Real Estate, Director, Social Innovation Collaborative,
University of Cincinnati. Este semestre me ha invitado a dar una charla virtual sobre mercados inmobiliarios en América Latina en su curso de International Real Estate. Existe la posibilidad de realizar la charla de forma presencial para el próximo año
  - Jorge de la Roca, Research Director at the USC Lusk Center for Real Estate, University of Southern
California. Hay mucho interés por empezar una agenda conjunta en economía urbana con aplicaciones
en América Latina

&lt;span style="color:blue"&gt;Para la financiación de alguna estancia, se espera aplicar a algunas becas (por ejemplo, la beca Fulbright Visiting Scholar Program, Stanford CASBS Fellowship) y con fondos propios

---
# &lt;span style="font-size:80%"&gt;Proyección e impacto académico, social y pedagógico del año sabático&lt;/span&gt;
&lt;spam style="font-size:120%"&gt;

**&lt;span style="color:blue"&gt;Impacto formativo (producto de innovación pedagógica)&lt;/span&gt;**

El diseño de un curso especializado en medición y estimación de efectos del cambio climático, y geografía del cambio climático ofrecerá herramientas actualizadas para responder a preguntas complejas en temas de transición energética. La idea es que este curso se ofrezca dentro de una microcredencial que permita llegar a diferentes públicos, lo que favorecerá los procesos de formación de estudiantes y dará un conocimiento especializado y diferenciador relevantes en el mercado laboral.
