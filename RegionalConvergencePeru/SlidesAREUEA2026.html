---
name: motivation
# &lt;span style="font-size:80%"&gt;Motivation&lt;/span&gt;
&lt;spam style="font-size:120%"&gt;

- Regional economic growth is a central topic in economic geography, as scholars seek to understand the factors that &lt;span style="color:blue"&gt;drive prosperity and regional disparities&lt;/span&gt; (Hansen, 2022). Traditional theories emphasize the role of:
&lt;p style="margin-bottom: -1em"&gt;
 - physical capital (Solow, 1956; Swan, 1956)
 - human capital and innovation (Romer, 1986; Lucas, 1988) 
 
- However, these explanations have become insufficient to account for persistent regional inequalities and two bodies of literature have emerged in parallel to contribute to the discussion: &lt;span style="color:blue"&gt;institutional quality&lt;/span&gt; and &lt;span style="color:blue"&gt;climate change&lt;/span&gt;

- &lt;span style="color:blue"&gt;Institutional quality&lt;/span&gt;: institutions influence economic performance through multiple channels, including productivity, innovation, entrepreneurship, and resource allocation efficiency  (Rodríguez-Pose, 2013; Rodríguez-Pose and Ketterer, 2020)

- &lt;span style="color:blue"&gt;Climate change&lt;/span&gt;:  temperature anomalies and extreme weather events, reduce labor productivity, damage agricultural output, and deter capital investment, thereby widening regional disparities  (Burke et al., 2015; Dell et al., 2012; Kalkuhl and Wenz, 2020)

---
# &lt;span style="font-size:80%"&gt;Motivation&lt;/span&gt;
&lt;spam style="font-size:120%"&gt;

**This paper** 
&lt;p style="margin-bottom: -1em"&gt;

- Institutional efficiency is not merely a determinant of regional growth, but also it is a fundamental moderator of how regional economies absorb and respond to climate variability 

- Regions have different economic structures and institutional capacities, absorbing climate disturbances in different ways `\(\Longrightarrow\)` &lt;span style="color:blue"&gt;heterogeneity in climate change sensitivity constitutes an important and underexplored dimension of regional inequality (Warsame et al., 2021; Acacha-Acakpo et al., 2024)

---
name: contribution
# &lt;span style="font-size:80%"&gt;Contribution&lt;/span&gt;
&lt;spam style="font-size:120%"&gt;

- This paper contributes to the literature on the effects of institutional quality and climate change on regional economic growth  

- We offer new empirical evidence, &lt;span style="color:blue"&gt;studying the context of a developing country where there are significant regional institutional disparities and a high degree of economic dependence on sectors vulnerable to climate change, such as agriculture and tourism.

- Using data at the regional level for &lt;span style="color:blue"&gt;Peru&lt;/span&gt; on a balanced panel of 24 departments over the period 2004 to 2019, we estimate &lt;span style="color:blue"&gt;spatial growth models&lt;/span&gt; that incorporate the efficiency of public resource allocation, and temperature and precipitation, as measures of climate change

---
name: lite
# &lt;span style="font-size:80%"&gt;Relevant literature&lt;/span&gt;
&lt;spam style="font-size:115%"&gt;

- The literature has recognized that &lt;span style="color:blue"&gt;institutional factors&lt;/span&gt; and &lt;span style="color:blue"&gt;environmental conditions&lt;/span&gt; are important factors explaining the regional economic growth (Baarsch et al., 2020; Aristizábal &amp; García, 2021; Kouadio &amp; Gakpa, 2022)

- In developing countries these factors are more significant, as &lt;span style="color:blue"&gt;regional inequalities are persistent&lt;/span&gt; and this is exacerbated by &lt;span style="color:blue"&gt;institutional weaknesses&lt;/span&gt; and &lt;span style="color:blue"&gt;climate vulnerability&lt;/span&gt; (Iammarino et al., 2019; Ibourk &amp; Elouaourti, 2023; Paglialunga et al., 2023)

- Institutions play a critical role in economic growth (Acemoglu &amp; Robinson, 2006):
&lt;p style="margin-bottom: -1em"&gt;
 - &lt;span style="color:blue"&gt;Europe and North America&lt;/span&gt;: strong and transparent institutions correlate with higher growth rates and lower regional inequalities (Rodríguez-Pose &amp; Di Cataldo, 2015; Charron et al., 2014)
 - &lt;span style="color:blue"&gt;Developing countries&lt;/span&gt;: institutional capacity tends to be weaker and more heterogeneous, resulting in uneven growth trajectories and regional economic divergence (Bosker &amp; Garretsen, 2009)

- Climate change has emerged as a key determinant of regional economic performance, where countries heavily dependent on climate-sensitive sectors, such as agriculture and tourism, face greater economic risks `\(\Longrightarrow\)` &lt;span style="color:blue"&gt;developing countries, but the evidence in these countries remains scarce (Burke et al., 2015; Damania et al., 2020; Baarsch et al., 2020)

&lt;span style="color:blue"&gt;This paper aims to offer new evidence on how institutional efficiency moderates the economic impact of climate variability shocks on regional growth

# &lt;span style="font-size:80%"&gt;Data and descriptive evidence&lt;/span&gt;
&lt;spam style="font-size:100%"&gt;

We tested the existence of sigma-type convergence in real GDP per capita:
&lt;p style="margin-bottom: -1em"&gt;
- Sigma convergence refers to the reduction over time in the cross-sectional dispersion of income per capita across regions
- This measure captures the tendency of poorer regions to grow faster than richer ones 

&lt;center&gt;&lt;spam style="font-size:100%"&gt;**Figure 6. Coefficient of variation and Theil index of real GDP per capita**
&lt;img src="sig_conv.png" width="60%" style="display: block; margin: auto;" /&gt;

name: model
# &lt;span style="font-size:80%"&gt;Econometric model&lt;/span&gt;
&lt;spam style="font-size:100%"&gt;

&lt;span style="color:blue"&gt;Beta convergence (Barro and Sala-i-Martin, 1991)&lt;/span&gt;:

The functional form of the conditional Beta convergence models using panel data is as follows:

`$$ln\left(\frac{Y_{it}}{Y_{it-1}}\right) = \alpha_i + \beta lnY_{it-1}$$`
`$$\hspace{11.8cm} + \lambda InstQuality_{ite} + \delta lnY_{it-1} \times InstQuality$$`
`$$\hspace{11.8cm} + \mu ClimateChange_{it} + \omega ClimateChange^2_{it}$$`
`$$\hspace{4cm} + \theta X_{it} + u_{it}$$`

&lt;spam style="font-size:95%"&gt; **Dependent variable**: GDP per capita growth rate for department `\(i\)` between period `\(t\)` and period `\(t−1\)` 
&lt;p style="margin-bottom: -.5em"&gt;
&lt;spam style="font-size:95%"&gt; `\(Y_{it-1}\)`: the GDP per capita for department `\(i\)` in period `\(t−1\)`
&lt;p style="margin-bottom: -.5em"&gt;
&lt;spam style="font-size:95%"&gt; &lt;span style="color:blue"&gt; `\(\beta\)`: convergence coefficient to estimate and is expected to be negative to reflect departments catching up to their steady-state levels
&lt;p style="margin-bottom: -.5em"&gt;
&lt;spam style="font-size:95%"&gt; `\(InstQuality\)`: efficiency, capacity and &lt;span style="color:blue"&gt;IQPA
&lt;p style="margin-bottom: -.5em"&gt;
&lt;spam style="font-size:95%"&gt; &lt;span style="color:blue"&gt; `\(\delta\)`: measures whether institutional performance facilitates regional economic growth and convergence 
&lt;p style="margin-bottom: -.5em"&gt;
&lt;spam style="font-size:95%"&gt; `\(ClimateChange\)`: temperature and precipitation (quadratic term allows us to identify the nonlinear relationship, threshold effect)
&lt;p style="margin-bottom: -.5em"&gt;
&lt;spam style="font-size:95%"&gt; `\(X\)`: is a matrix of explanatory variables representing different departmental steady states
&lt;p style="margin-bottom: -.5em"&gt;
&lt;spam style="font-size:95%"&gt; `\(α_i\)`: fixed effects for each department and captures unobserved heterogeneity related to the steady state of each department
&lt;p style="margin-bottom: -.5em"&gt;
&lt;spam style="font-size:95%"&gt; `\(u_{it}\)`: error term

---

---
name: conclusions
# &lt;span style="font-size:80%"&gt;Conclusions&lt;/span&gt;
&lt;spam style="font-size:120%"&gt;

- In this paper we analyze &lt;span style="color:blue"&gt;the effects of institutional quality and climate change on economic growth&lt;/span&gt; at the intra-regional level in the context of a developing Latin American country, Peru

- This study makes a novel contribution in its &lt;span style="color:blue"&gt;simultaneous incorporation of institutional and climate risk variables and spatial dependence into a panel model of intra-regional growth&lt;/span&gt;, which has been little explored in the literature on regional growth in developing countries

- The findings highlight the &lt;span style="color:blue"&gt;critical role of local institutional quality in fostering economic growth

- This study shows that &lt;span style="color:blue"&gt;climate change has a complex relationship with regional economic growth

- Temperature significantly impact Peru's economic growth over the analyzed period. &lt;span style="color:blue"&gt;Including a quadratic term for temperature allows for identifying a nonlinear relationship consistent with economic theory, suggesting that rising temperatures harm growth beyond a certain threshold

- &lt;span style="color:blue"&gt;Climate change poses a serious challenge to regional growth&lt;/span&gt;. Addressing its adverse effects requires adaptive strategies, such as investments in climate-resilient infrastructure and sustainable agricultural practices, to mitigate temperature-related economic losses
